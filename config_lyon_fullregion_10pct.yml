## Lyon Phase A — full-region 10% scenario artifacts
## Produces the prepared MATSim XMLs for a 10% full-region scenario.
## Auto-generated by scripts/setup_drt_scenario.py --with-phase-a
##
## run_matsim: false here because eqasim's matsim.simulation.run hardcodes
## lastIteration=1, which doesn't produce stable congested travel times.
## The actual travel-time extraction happens via
## scripts/run_travel_time_extraction.sh after this config completes —
## that launches RunSimulation with lastIteration=40.
## Uses IDF default mode choice parameters (Hörl & Balac 2021) — no calibration.

working_directory: C:/matsim_cache_lyon

run:
  - synthesis.output
  - matsim.output

config:
  processes: 4
  hts: entd
  sampling_rate: 0.10
  random_seed: 1234

  data_path: data
  output_path: output_fullregion_10pct
  output_prefix: lyon_fullregion_10pct_

  java_binary: C:/Users/VWAUCCY/dev/msf/.jdk/jdk-25.0.2+10/bin/java
  maven_binary: C:/Users/VWAUCCY/dev/msf/projects/Dissertation/matsim_scenarios/eqasim-france/mvn_wrapper.cmd
  java_memory: 48G
  mode_choice: false
  run_matsim: false   # synpp only produces prepared XMLs; see comment above

  regions: []
  departments: ["01", "38", "42", "69"]

  gtfs_path: gtfs_lyon
  osm_path: osm_lyon
  ban_path: ban_lyon
  bdtopo_path: bdtopo_lyon
