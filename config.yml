## Lyon scenario configuration — Chrigarr9 dissertation
## Based on upstream eqasim-france v1.4.0+25 (main @ 5a00846)
## Docs: docs/cases/lyon.md, docs/population/population_data.md
## Upstream IdF template recoverable via: git show upstream/main:config.yml

working_directory: cache

run:
  - synthesis.output
  # - matsim.output  # enable once OSM + GTFS data is downloaded

config:
  processes: 4

  hts: entd
  # hts: edgt_lyon
  # edgt_lyon_source: adisp

  sampling_rate: 0.01
  random_seed: 1234

  data_path: data
  output_path: output
  output_prefix: lyon_

  java_memory: 10G
  mode_choice: false

  regions: []
  departments: ["01", "38", "42", "69"]

  gtfs_path: gtfs_lyon
  osm_path: osm_lyon
  ban_path: ban_lyon
  bdtopo_path: bdtopo_lyon
